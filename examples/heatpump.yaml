                name: Starts
            grid_options:
              columns: full
          - type: markdown
            content:
              Starts per dag vereisen langetermijnstatistieken van de cumulatieve
              teller. Controleer bij ontbrekende balken de state_class en statistiekbeschikbaarheid.
              Dagelijkse starts en looptijden zijn benaderingen bij afgeronde of minder
              frequent opgehaalde API-tellers. Deze configuratie maakt geen helpers aan.
            grid_options:
              columns: full
  - title: Warmwater
    path: warmwater
    icon: mdi:water-thermometer-outline

# Fictional entities: replace with your own device entities before use.
# Requires updated ha-custom-dash.js and ApexCharts Card; use the Home Room theme.
---
title: Warmtepomp
views:
  - title: Overzicht
    path: overzicht
    icon: mdi:heat-pump-outline
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Nu en comfort
            icon: mdi:home-thermometer-outline
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.example_heat_pump_0
                state: 'off'
            card:
              type: markdown
              content:
                '**Systeemcontroller offline.** Bekijk Diagnose; meetwaarden kunnen
                achterlopen.'
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.example_heat_pump_1
                state: 'off'
            card:
              type: markdown
              content: '**Buitenunit offline.** Bekijk Diagnose; meetwaarden kunnen achterlopen.'
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.example_heat_pump_2
                state: 'off'
            card:
              type: markdown
              content:
                '**Kamerregeling offline.** Bekijk Diagnose; binnencomfort kan onvolledig
                zijn.'
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.example_heat_pump_3
                state: 'on'
            card:
              type: markdown
              content: '**Storing gemeld.** De storingsvergrendeling is actief. Zie Diagnose.'
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.example_heat_pump_4
                state: 'on'
            card:
              type: markdown
              content: '**Externe vergrendeling actief.** Zie Diagnose.'
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.example_heat_pump_5
                state: 'on'
            card:
              type: markdown
              content:
                '**Elektrische bijverwarming actief.** Bekijk de werking in Diagnose
                als dit onverwacht is.'
            grid_options:
              columns: full
          - type: custom:home-heat-pump-status-card
            entity: sensor.example_heat_pump_6
            mode_entity: sensor.example_heat_pump_7
            operating_entity: sensor.example_heat_pump_8
            operating_states:
              - heating
            heating_states:
              - climateCircuitOne
            hot_water_states:
              - domesticHotWater
            compressor: binary_sensor.example_heat_pump_9
            fan_speed: sensor.example_heat_pump_10
            electric_power: sensor.example_heat_pump_11
            outdoor_temperature: sensor.example_heat_pump_12
            auxiliary_heating: binary_sensor.example_heat_pump_5
            controller_online: binary_sensor.example_heat_pump_0
            outdoor_online: binary_sensor.example_heat_pump_1
            fault_entity: binary_sensor.example_heat_pump_3
            external_lock: binary_sensor.example_heat_pump_4
            grid_options:
              columns: full
          - type: custom:home-metric-card
            items:
              - entity: sensor.example_heat_pump_13
                name: Binnen
                icon: mdi:home-thermometer-outline
                secondary_entity: sensor.example_heat_pump_14
                secondary_name: Gewenst
              - entity: sensor.example_heat_pump_12
                name: Buiten
                icon: mdi:weather-partly-cloudy
              - entity: sensor.example_heat_pump_15
                name: Warmwater
                icon: mdi:water-thermometer
                secondary_entity: sensor.example_heat_pump_16
                secondary_name: Doel
              - entity: sensor.example_heat_pump_17
                name: Aanvoer
                icon: mdi:heating-coil
                secondary_entity: sensor.example_heat_pump_18
                secondary_name: Retour
            grid_options:
              columns: full
          - type: custom:home-metric-card
            title: Vandaag
            layout: panel
            columns: 2
            items:
              - entity: sensor.example_heat_pump_19
                name: Verwarming
              - entity: sensor.example_heat_pump_20
                name: Warmwater
              - entity: sensor.example_heat_pump_21
                name: Compressorstarts
                precision: 0
              - entity: sensor.example_heat_pump_22
                name: Compressor
                format: duration_hours
              - entity: sensor.example_heat_pump_23
                name: Gem. looptijd
                precision: 0
              - entity: sensor.example_heat_pump_24
                name: Kosten · vast tarief
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: screen
                media_query: '(max-width: 1099px)'
            card:
              type: custom:apexcharts-card
              header:
                show: true
                title: Binnencomfort · 24 uur
                show_states: false
                colorize_states: false
              graph_span: 24h
              update_interval: 5min
              apex_config:
                chart:
                  height: 180
                  toolbar:
                    show: false
                  background: transparent
                  foreColor: var(--secondary-text-color)
                legend:
                  show: true
                  position: bottom
                  fontSize: 12px
                grid:
                  borderColor: var(--divider-color)
                markers:
                  size: 0
              series:
                - entity: sensor.example_heat_pump_13
                  name: Binnen
                  color: var(--primary-color)
                  curve: straight
                  stroke_width: 2
                  group_by:
                    func: avg
                    duration: 10min
                - entity: sensor.example_heat_pump_14
                  name: Gewenst
                  color: '#D69A45'
                  curve: stepline
                  stroke_width: 2
                  group_by:
                    func: last
                    duration: 10min
                  stroke_dash: 5
                - entity: sensor.example_heat_pump_25
                  name: Referentie
                  color: '#9BA3AF'
                  curve: straight
                  stroke_width: 2
                  group_by:
                    func: avg
                    duration: 10min
              grid_options:
                columns: full
            grid_options:
              columns: full
          - type: custom:home-system-health-card
            items:
              - entity: binary_sensor.example_heat_pump_0
                name: Systeemcontroller
                updated: sensor.example_heat_pump_26
              - entity: binary_sensor.example_heat_pump_1
                name: Buitenunit
                updated: sensor.example_heat_pump_27
              - entity: binary_sensor.example_heat_pump_2
                name: Kamerregeling
                updated: sensor.example_heat_pump_28
            grid_options:
              columns: full
          - type: custom:home-metric-card
            title: Energie en rendement
            layout: list
            items:
              - entity: sensor.example_heat_pump_29
                name: Verwarming · 7 dagen
                precision: 2
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Werking en trends
            icon: mdi:chart-line
            grid_options:
              columns: full
          - type: custom:home-heat-flow-card
            entity: sensor.example_heat_pump_6
            mode_entity: sensor.example_heat_pump_7
            operating_entity: sensor.example_heat_pump_8
            operating_states:
              - heating
            heating_states:
              - climateCircuitOne
            hot_water_states:
              - domesticHotWater
            compressor: binary_sensor.example_heat_pump_9
            fan_speed: sensor.example_heat_pump_10
            electric_power: sensor.example_heat_pump_11
            outdoor_temperature: sensor.example_heat_pump_12
            auxiliary_heating: binary_sensor.example_heat_pump_5
            controller_online: binary_sensor.example_heat_pump_0
            outdoor_online: binary_sensor.example_heat_pump_1
            fault_entity: binary_sensor.example_heat_pump_3
            external_lock: binary_sensor.example_heat_pump_4
            supply_temperature: sensor.example_heat_pump_17
            return_temperature: sensor.example_heat_pump_18
            temperature_difference: sensor.example_heat_pump_30
            pressure: sensor.example_heat_pump_31
            water_temperature: sensor.example_heat_pump_15
            water_target: sensor.example_heat_pump_16
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: screen
                media_query: '(min-width: 1100px)'
            card:
              type: custom:apexcharts-card
              header:
                show: true
                title: Binnencomfort · 24 uur
                show_states: false
                colorize_states: false
              graph_span: 24h
              update_interval: 5min
              apex_config:
                chart:
                  height: 180
                  toolbar:
                    show: false
                  background: transparent
                  foreColor: var(--secondary-text-color)
                legend:
                  show: true
                  position: bottom
                  fontSize: 12px
                grid:
                  borderColor: var(--divider-color)
                markers:
                  size: 0
              series:
                - entity: sensor.example_heat_pump_13
                  name: Binnen
                  color: var(--primary-color)
                  curve: straight
                  stroke_width: 2
                  group_by:
                    func: avg
                    duration: 10min
                - entity: sensor.example_heat_pump_14
                  name: Gewenst
                  color: '#D69A45'
                  curve: stepline
                  stroke_width: 2
                  group_by:
                    func: last
                    duration: 10min
                  stroke_dash: 5
                - entity: sensor.example_heat_pump_25
                  name: Referentie
                  color: '#9BA3AF'
                  curve: straight
                  stroke_width: 2
                  group_by:
                    func: avg
                    duration: 10min
              grid_options:
                columns: full
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: Elektrisch en thermisch vermogen · 24 uur
              show_states: false
              colorize_states: false
            graph_span: 24h
            update_interval: 5min
            apex_config:
              chart:
                height: 180
                toolbar:
                  show: false
                background: transparent
                foreColor: var(--secondary-text-color)
              legend:
                show: true
                position: bottom
                fontSize: 12px
              grid:
                borderColor: var(--divider-color)
              markers:
                size: 0
            series:
              - entity: sensor.example_heat_pump_11
                name: Elektrisch
                color: '#D69A45'
                curve: straight
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 10min
              - entity: sensor.example_heat_pump_6
                name: Thermisch
                color: var(--primary-color)
                curve: straight
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 10min
            grid_options:
              columns: full
          - type: history-graph
            title: Bedrijf · 24 uur
            hours_to_show: 24
            entities:
              - entity: binary_sensor.example_heat_pump_9
                name: Compressor
              - entity: binary_sensor.example_heat_pump_5
                name: Bijverwarming
              - entity: sensor.example_heat_pump_7
                name: Warmtebestemming
            grid_options:
              columns: full
          - type: custom:home-metric-card
            columns: 2
            items:
              - entity: sensor.example_heat_pump_29
                name: Rendement verwarming · 7 dagen
                precision: 2
              - entity: sensor.example_heat_pump_31
                name: Systeemdruk
            grid_options:
              columns: full
          - type: markdown
            content:
              '**Meer detail:** Afstelling toont comfort en pendelgedrag, Warmwater
              toont opslag en doeltemperatuur, Energie toont verbruik en rendement, Diagnose
              bevat alle componentwaarden. Ophaaltijd is niet de oorspronkelijke meettijd.'
            grid_options:
              columns: full
  - title: Afstelling
    path: afstelling
    icon: mdi:tune-vertical
    type: sections
    max_columns: 3
    dense_section_placement: false
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Comfort en stooklijn
            icon: mdi:home-thermometer
            grid_options:
              columns: full
          - type: custom:home-metric-card
            layout: strip
            columns: 3
            items:
              - entity: sensor.example_heat_pump_32
                name: Helling
              - entity: sensor.example_heat_pump_33
                name: Verschuiving
              - entity: sensor.example_heat_pump_34
                name: Afwijking
            grid_options:
              columns: full
          - type: custom:home-metric-card
            title: Actueel comfort
            layout: list
            items:
              - entity: sensor.example_heat_pump_13
                name: Binnen
              - entity: sensor.example_heat_pump_14
                name: Gewenst
              - entity: sensor.example_heat_pump_25
                name: Referentietemperatuur
              - entity: sensor.example_heat_pump_34
                name: Afwijking
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.example_heat_pump_35
                state_not: unknown
              - condition: state
                entity: sensor.example_heat_pump_35
                state_not: unavailable
            card:
              type: custom:home-metric-card
              columns: 1
              items:
                - entity: sensor.example_heat_pump_35
                  name: Luchtvochtigheid
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: Binnencomfort · 7 dagen
              show_states: false
              colorize_states: false
            graph_span: 7d
            update_interval: 5min
            apex_config:
              chart:
                height: 230
                toolbar:
                  show: false
                background: transparent
                foreColor: var(--secondary-text-color)
              legend:
                show: true
                position: bottom
                fontSize: 12px
              grid:
                borderColor: var(--divider-color)
              markers:
                size: 0
            series:
              - entity: sensor.example_heat_pump_13
                name: Binnen
                color: var(--primary-color)
                curve: straight
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 1h
              - entity: sensor.example_heat_pump_14
                name: Gewenst
                color: '#D69A45'
                curve: stepline
                stroke_width: 2
                group_by:
                  func: last
                  duration: 1h
                stroke_dash: 5
              - entity: sensor.example_heat_pump_25
                name: Referentie
                color: '#9BA3AF'
                curve: straight
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 1h
            grid_options:
              columns: full
          - type: custom:apexcharts-card
            header:
              show: true
              title: Temperatuurafwijking en buiten · 7 dagen
              show_states: false
              colorize_states: false
            graph_span: 7d
            update_interval: 5min
            apex_config:
              chart:
                height: 220
                toolbar:
                  show: false
                background: transparent
                foreColor: var(--secondary-text-color)
              legend:
                show: true
                position: bottom
                fontSize: 12px
              grid:
                borderColor: var(--divider-color)
              markers:
                size: 0
              annotations:
                yaxis:
                  - 'y': 0
                    yAxisIndex: 0
                    borderColor: '#9BA3AF'
                    strokeDashArray: 4
                    label:
                      text: Op doel
            series:
              - entity: sensor.example_heat_pump_34
                name: Afwijking
                color: var(--primary-color)
                curve: straight
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 1h
                yaxis_id: afwijking
              - entity: sensor.example_heat_pump_12
                name: Buiten
                color: '#7A9DBA'
                curve: straight
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 1h
                yaxis_id: buiten
            yaxis:
              - id: afwijking
                decimals: 1
                apex_config:
                  title:
                    text: Afwijking · °C
              - id: buiten
                opposite: true
                decimals: 0
                apex_config:
                  title:
                    text: Buiten · °C
            grid_options:
              columns: full
          - type: markdown
            content:
              Instellingen zijn **alleen uitleesbaar**. Vergelijk meerdere dagen
              met vergelijkbare buitentemperaturen. Warmwaterbedrijf, ontdooicycli en zoninstraling
              kunnen het temperatuurverloop beïnvloeden; een oorzaak wordt hier niet automatisch
              vastgesteld.
            grid_options:
              columns: full
      - type: grid
        column_span: 1
        cards:

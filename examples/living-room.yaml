# All entity IDs and names are fictional. Replace them with your own entities.
# Install the bundled resource before configuring this view.
title: Thuis
views:
  - title: Woonkamer
    path: woonkamer
    icon: mdi:sofa-outline
    type: masonry
    cards:
      - type: vertical-stack
        cards:
          - type: custom:home-room-header-card
            icon: mdi:sofa-outline
            temperature: sensor.example_room_temperature
            humidity: sensor.example_room_humidity
            lights:
              - light.example_ceiling
              - light.example_reading
              - light.example_wall
              - light.example_floor
              - light.example_accent
          - type: custom:home-scene-card
            title: Scènes
            scenes:
              - entity: scene.example_read
                name: Lezen
                icon: mdi:book-open-page-variant-outline
              - entity: scene.example_relax
                name: Ontspannen
                icon: mdi:weather-night
              - entity: scene.example_film
                name: Film
                icon: mdi:movie-open-outline
          - type: custom:home-room-lighting-card
            title: Verlichting
            lights:
              - entity: light.example_ceiling
                name: Plafondspots
                icon: mdi:light-recessed
              - entity: light.example_reading
                name: Leeslampen
              - entity: light.example_wall
                name: Wandlampen
              - entity: light.example_floor
                name: Vloer- en tafellampen
                icon: mdi:floor-lamp
              - entity: light.example_accent
                name: Sfeerlampen
          - type: custom:home-section-card
            title: Media
            cards:
              - type: media-control
                entity: media_player.example_display
          - type: custom:home-section-card
            title: Klimaat
            cards:
              - type: custom:home-climate-card
                entity: climate.example_heating
                name: Vloerverwarming
